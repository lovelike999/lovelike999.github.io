<body>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1520" viewBox="0 0 1500 1520">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="1500" height="1520" fill="#ffffff"/>

  <text x="40" y="38" font-size="21" font-weight="700" fill="#0f172a">{}@0 + m3-control：逐候选判定的检索流程</text>
  <text x="40" y="62" font-size="13" fill="#64748b">余弦只决定“取哪些候选”，m3-control 只决定“哪两段能回答问题”——两步的输入、成本、分数含义都不同</text>

  <!-- LEFT FLOW -->
  <rect x="40" y="86" width="430" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">问题 q + 对话上下文</text>
  <text x="255" y="127" text-anchor="middle" font-size="12" fill="#475569">候选单位 = 一个片段的完整文本</text>

  <rect x="40" y="166" width="430" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="255" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">余弦召回（全图，τ = 0）</text>
  <text x="255" y="207" text-anchor="middle" font-size="12" fill="#475569">节点向量算余弦，片段取最大值</text>

  <rect x="40" y="246" width="430" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="255" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">取前 24 个候选组成池子</text>
  <text x="255" y="287" text-anchor="middle" font-size="12" fill="#475569">candidate_pool = 24；实测平均 23.0</text>

  <rect x="40" y="326" width="430" height="52" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="255" y="348" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">m3-control 逐候选打 0–10 分</text>
  <text x="255" y="367" text-anchor="middle" font-size="12" fill="#991b1b">每段一次 chat 请求，看不到其他候选</text>

  <rect x="40" y="406" width="430" height="52" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="255" y="428" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">准入：归一后 ≥ 0.05</text>
  <text x="255" y="447" text-anchor="middle" font-size="12" fill="#475569">等价于“丢弃 0 分候选”</text>

  <rect x="40" y="486" width="430" height="52" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="255" y="508" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">剔除已见片段 → 取前 2 段</text>
  <text x="255" y="527" text-anchor="middle" font-size="12" fill="#047857">seen_policy = filter_first</text>

  <rect x="40" y="566" width="430" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="588" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">证据进入上下文 → 模型作答</text>
  <text x="255" y="607" text-anchor="middle" font-size="12" fill="#475569">至多 2 段；不足按实际条数交付</text>

  <polygon points="255,648 352,684 255,720 158,684" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="255" y="689" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">已作答 / 满 5 轮？</text>

  <rect x="40" y="754" width="430" height="52" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="255" y="776" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">三判官重判同一批回答</text>
  <text x="255" y="795" text-anchor="middle" font-size="12" fill="#475569">deepseek / gpt-4o / gpt-4o-mini</text>

  <rect x="40" y="834" width="430" height="44" rx="9" fill="#0f172a"/>
  <text x="255" y="861" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">准确率 + 逐题配对 McNemar</text>

  <line x1="255" y1="138" x2="255" y2="164" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="218" x2="255" y2="244" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="298" x2="255" y2="324" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="378" x2="255" y2="404" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="458" x2="255" y2="484" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="538" x2="255" y2="564" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="618" x2="255" y2="646" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="720" x2="255" y2="752" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="806" x2="255" y2="832" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="265" y="740" font-size="12" fill="#475569">是</text>
  <path d="M158 684 L 20 684 L 20 192 L 38 192" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#l)"/>
  <text x="14" y="440" text-anchor="middle" font-size="12" fill="#b45309" transform="rotate(-90 14 440)">否：下一轮（≤5）</text>

  <!-- PANEL 1: order -->
  <rect x="520" y="86" width="940" height="300" rx="10" fill="#fcfdfd" stroke="#cbd5e1"/>
  <text x="546" y="114" font-size="16" font-weight="700" fill="#0f172a">① 交付顺序：同一批候选，两种结果</text>
  <text x="546" y="136" font-size="12" fill="#64748b">情形：排名前 2 的片段在之前轮次已交付；判断依据只是“是否见过”，与分数无关</text>
  <rect x="546" y="148" width="888" height="24" fill="#eef2f6"/>
  <text x="562" y="165" font-size="12" font-weight="600" fill="#334155">排名</text><text x="632" y="165" font-size="12" font-weight="600" fill="#334155">片段</text>
  <text x="752" y="165" font-size="12" font-weight="600" fill="#334155">判定分数</text><text x="862" y="165" font-size="12" font-weight="600" fill="#334155">是否已交付</text>
  <text x="992" y="165" font-size="12" font-weight="600" fill="#334155">结论</text>
  <text x="562" y="192" font-size="12.5" fill="#334155">#1</text><text x="632" y="192" font-size="12.5" fill="#334155">CLIP_37</text><text x="752" y="192" font-size="12.5" fill="#334155">1.0</text><text x="862" y="192" font-size="12.5" fill="#b91c1c">已见 ✗</text><text x="992" y="192" font-size="12.5" fill="#334155">被剔除</text>
  <text x="562" y="214" font-size="12.5" fill="#334155">#2</text><text x="632" y="214" font-size="12.5" fill="#334155">CLIP_12</text><text x="752" y="214" font-size="12.5" fill="#334155">0.9</text><text x="862" y="214" font-size="12.5" fill="#b91c1c">已见 ✗</text><text x="992" y="214" font-size="12.5" fill="#334155">被剔除</text>
  <text x="562" y="236" font-size="12.5" fill="#334155">#3</text><text x="632" y="236" font-size="12.5" fill="#334155">CLIP_05</text><text x="752" y="236" font-size="12.5" fill="#334155">0.8</text><text x="862" y="236" font-size="12.5" fill="#047857">未见 ✓</text><text x="992" y="236" font-size="12.5" fill="#047857">交付</text>
  <text x="562" y="258" font-size="12.5" fill="#334155">#4</text><text x="632" y="258" font-size="12.5" fill="#334155">CLIP_21</text><text x="752" y="258" font-size="12.5" fill="#334155">0.3</text><text x="862" y="258" font-size="12.5" fill="#047857">未见 ✓</text><text x="992" y="258" font-size="12.5" fill="#047857">交付</text>
  <text x="546" y="286" font-size="12.5" fill="#065f46">filter_first（本文）：先剔已见再取前 2 → 交付 CLIP_05、CLIP_21</text>
  <text x="546" y="306" font-size="12.5" fill="#991b1b">topk_first（M3 原版）：先取前 2 再剔已见 → 两段都交付过 → 本轮空手</text>
  <line x1="546" y1="318" x2="1434" y2="318" stroke="#e2e8f0"/>
  <text x="546" y="338" font-size="12.5" fill="#475569">代码：jev_retrieve_listwise.py:869–880 —— above_cut 之后按 seen_policy 分支</text>
  <text x="546" y="358" font-size="12.5" fill="#475569">注意：该消融只在重排路径内做；余弦基线仍沿用原版顺序（先截断后去重）</text>
  <text x="546" y="376" font-size="12" fill="#94a3b8">表中片段编号与分数为示意，用于说明顺序差异</text>

  <!-- PANEL 2: per-round cost -->
  <rect x="520" y="400" width="940" height="214" rx="10" fill="#fcfdfd" stroke="#cbd5e1"/>
  <text x="546" y="428" font-size="16" font-weight="700" fill="#0f172a">② 一轮的真实开销：≈23 次本地生成调用</text>
  <text x="546" y="450" font-size="12" fill="#64748b">“本地”省的是钱，不是时间——余弦一次算完，判定要逐段生成</text>
  <text x="546" y="478" font-size="13" fill="#334155">· 每轮请求数 = 池子大小（实测平均 22.9；18,069 次判定 / 790 轮）</text>
  <text x="546" y="500" font-size="13" fill="#334155">· 每次请求：temperature = 0，timeout = 180 s，retries = 4，max_tokens = 1024</text>
  <text x="546" y="522" font-size="13" fill="#334155">· 并发：ThreadPoolExecutor(workers)，E2 实测用 16 线程</text>
  <text x="546" y="544" font-size="13" fill="#334155">· 500 题合计：790 轮检索、18,069 次调用、平均 1.58 轮/题、货币成本 0</text>
  <text x="546" y="572" font-size="13" fill="#991b1b">对照：余弦阶段是“一次矩阵运算算完全部候选”，判定阶段是“每段一次自回归生成”。</text>
  <text x="546" y="594" font-size="12" fill="#94a3b8">代码：_score_chat_percandidate（:675–700）与 _chat（:589–600）</text>

  <!-- PANEL 3: cosine vs judgement -->
  <rect x="520" y="628" width="940" height="210" rx="10" fill="#fcfdfd" stroke="#cbd5e1"/>
  <text x="546" y="656" font-size="16" font-weight="700" fill="#0f172a">③ 两个分数不是一回事</text>
  <rect x="546" y="670" width="420" height="112" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="566" y="692" font-size="13.5" font-weight="600" fill="#1e3a8a">余弦分数（决定“谁进池子”）</text>
  <text x="566" y="714" font-size="12.5" fill="#334155">问的是“像不像”：节点向量内积，片段取 max</text>
  <text x="566" y="734" font-size="12.5" fill="#334155">不调用语言模型；同一查询下全部候选一次算完</text>
  <text x="566" y="754" font-size="12.5" fill="#334155">全量 423,079 个候选，中位数 0.375</text>
  <text x="566" y="772" font-size="12" fill="#94a3b8">分数整体偏低，不能用 0.5 这类绝对线去卡</text>
  <rect x="986" y="670" width="448" height="112" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="1006" y="692" font-size="13.5" font-weight="600" fill="#991b1b">判定分数（决定“哪两段交付”）</text>
  <text x="1006" y="714" font-size="12.5" fill="#334155">问的是“能不能答”：模型给 0–10 的整数</text>
  <text x="1006" y="734" font-size="12.5" fill="#334155">每段一次生成；看不到其他候选，独立判断</text>
  <text x="1006" y="754" font-size="12.5" fill="#334155">归一化后与 0.05 比较</text>
  <text x="1006" y="772" font-size="12" fill="#94a3b8">同一段在不同轮次得分可能不同（状态变化）</text>
  <text x="546" y="804" font-size="12.5" fill="#475569">一句话：余弦决定候选集，判定决定交付集。把两者都叫“相关性”会读错整条管线。</text>
  <text x="546" y="824" font-size="12" fill="#94a3b8">代码：_prefilter（:496–552）与 _score_chat_percandidate（:675–700）</text>

  <!-- PANEL 4: prompt + distribution -->
  <rect x="520" y="848" width="940" height="330" rx="10" fill="#fcfdfd" stroke="#cbd5e1"/>
  <text x="546" y="876" font-size="16" font-weight="700" fill="#0f172a">④ 0–10 分是怎么来的：提示词 + 解析 + 实际分布</text>
  <rect x="546" y="888" width="440" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="562" y="908" font-size="12" font-family="Consolas,monospace" fill="#0f172a">Question: {query}</text>
  <text x="562" y="928" font-size="12" font-family="Consolas,monospace" fill="#0f172a">Clip: {body}</text>
  <text x="562" y="952" font-size="12" font-family="Consolas,monospace" fill="#0f172a">Does this clip contain the fact needed</text>
  <text x="562" y="970" font-size="12" font-family="Consolas,monospace" fill="#0f172a">to answer the question? Reply with a</text>
  <text x="562" y="988" font-size="12" font-family="Consolas,monospace" fill="#0f172a">single integer 0-10, where 10 means it</text>
  <text x="562" y="1006" font-size="12" font-family="Consolas,monospace" fill="#0f172a">states the fact explicitly and 0 means</text>
  <text x="562" y="1024" font-size="12" font-family="Consolas,monospace" fill="#0f172a">it is unrelated. Start with `SCORE: n`.</text>
  <text x="1006" y="908" font-size="13" font-weight="600" fill="#0f172a">解析规则</text>
  <text x="1006" y="932" font-size="12.5" fill="#334155">1. 正则抓 `SCORE:\s*(10|[0-9])`</text>
  <text x="1006" y="954" font-size="12.5" fill="#334155">2. 抓到 → 除以 10</text>
  <text x="1006" y="976" font-size="12.5" fill="#334155">3. 没抓到 → 取回复里最后一个数字</text>
  <text x="1006" y="998" font-size="12.5" fill="#334155">4. 仍无 → 记 0</text>
  <text x="1006" y="1024" font-size="12" fill="#94a3b8">整数刻度，不是概率；未经校准</text>
  <line x1="546" y1="1052" x2="1434" y2="1052" stroke="#e2e8f0"/>
  <text x="546" y="1074" font-size="13" font-weight="600" fill="#0f172a">实测分布（18,069 次判定）</text>
  <text x="546" y="1098" font-size="12.5" fill="#334155">0 分 81.2%　｜　2 分 8.0%　｜　3 分 3.4%　｜　8 分 2.8%　｜　10 分 1.9%　｜　其余 &lt;1%</text>
  <text x="546" y="1122" font-size="12.5" fill="#991b1b">5 分只出现 4 次、4 分 41 次——模型基本不用中段，实际是“0 / 2–3 / 8–10”三档。</text>
  <text x="546" y="1146" font-size="12.5" fill="#334155">由于最小非零值为 0.1，min_noul = 0.05 等价于“丢弃 0 分”，约 18.8% 的候选过线。</text>
  <text x="546" y="1168" font-size="12" fill="#94a3b8">代码：jev_retrieve_listwise.py:675–700（提示词与解析）</text>

  <!-- PANEL 5: code map + results -->
  <rect x="520" y="1190" width="940" height="300" rx="10" fill="#fcfdfd" stroke="#cbd5e1"/>
  <text x="546" y="1218" font-size="16" font-weight="700" fill="#0f172a">⑤ 代码位置速查 + 实测结果</text>
  <text x="546" y="1244" font-size="12.5" fill="#334155">候选池　_prefilter　　　　　　:496–552　节点余弦 → 片段取 max → 截断 24 → 空池兜底</text>
  <text x="546" y="1266" font-size="12.5" fill="#334155">逐候选　_score_chat_percand　:675–700　每段一次 chat，max_tokens 1024</text>
  <text x="546" y="1288" font-size="12.5" fill="#334155">并发　　ThreadPoolExecutor　 :693　　　 workers（E2 用 16）</text>
  <text x="546" y="1310" font-size="12.5" fill="#334155">准入选择　above_cut + seen　 :869–880　≥0.05 → filter_first → 取前 2</text>
  <text x="546" y="1332" font-size="12.5" fill="#334155">请求参数　_chat　　　　　　　:589–600　temperature 0，timeout 180 s，retries 4</text>
  <line x1="546" y1="1348" x2="1434" y2="1348" stroke="#e2e8f0"/>
  <text x="546" y="1372" font-size="13" fill="#334155">准确率（web 前 500 题）：deepseek 54.60　|　gpt-4o 57.60　|　gpt-4o-mini 46.80</text>
  <text x="546" y="1396" font-size="13" fill="#334155">同批次余弦基线 43.60 → 逐候选判定后提升约 11 分</text>
  <text x="546" y="1420" font-size="13" fill="#991b1b">三个判官相差 10.8 分——同一批回答，换判官就能改变结论方向。</text>
  <text x="546" y="1446" font-size="12" fill="#94a3b8">本图描述 {}@0 + m3-control；{mq} 变体未在此图中（其查询扩展发生在余弦召回之前）。</text>
