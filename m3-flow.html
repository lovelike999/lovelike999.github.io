  <text x="494" y="738" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">· 打分对象是节点，片段分数 = 该片段所有节点余弦的最大值（mode = max）</text>

  <rect x="820" y="1090" width="636" height="138" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="836" y="1210" font-family="Microsoft YaHei, sans-serif" font-size="11.5" fill="#64748b">这是“门槛量错了东西”的根源，也是 82.4% 候选卡在 0.5 以下的原因</text>
