<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flow_diagram</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8fafc; /* 浅浅的页面背景色 */
            display: flex;
            justify-content: center; /* 居中展示 */
        }
        .container {
            width: 100%;
            max-width: 1400px; /* 匹配你新图的宽度 */
            background-color: #ffffff; /* SVG 底色 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto; /* 保证自适应缩放 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 下面是您最新的 SVG 代码 -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1330">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
            </marker>
            <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
            </marker>
            <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
            </marker>
          </defs>

          <rect width="1400" height="1330" fill="#ffffff"/>

          <text x="46" y="44" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
            {mq} + Jev @ τ=0：单题推理流程
          </text>
          <text x="46" y="70" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">
            左侧为完整流程；右侧两块放大说明"顺序"与"一轮的判定调用"
          </text>

          <!-- ================= LEFT FLOW ================= -->
          <rect x="46" y="96" width="404" height="56" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
          <text x="248" y="121" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#0f172a">问题 q + 对话上下文</text>
          <text x="248" y="141" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">两臂共用同一张记忆图</text>

          <rect x="46" y="184" width="404" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
          <text x="248" y="209" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#0f172a">查询扩展（multiquery）</text>
          <text x="248" y="229" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">一条问题 → 多条改写查询 q₁…qₖ</text>

          <rect x="46" y="272" width="404" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
          <text x="248" y="297" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#0f172a">余弦召回 · 候选池 top-24</text>
          <text x="248" y="317" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">prefilter = 0：只排序，不设门槛</text>

          <rect x="46" y="360" width="404" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
          <text x="248" y="385" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#0f172a">Jev 逐候选判定</text>
          <text x="248" y="405" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">s(c, q)：该候选是否足以回答（0–1）</text>

          <rect x="46" y="448" width="404" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
          <text x="248" y="473" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#0f172a">准入：s ≥ 0.05</text>
          <text x="248" y="493" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">低于阈值的候选在此丢弃</text>

          <rect x="46" y="536" width="404" height="56" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
          <text x="248" y="561" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#065f46">剔除已见片段 → 取前 2 段</text>
          <text x="248" y="581" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#047857">filter_first：先过滤，后截断</text>
          <line x1="450" y1="564" x2="512" y2="300" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrowBlue)"/>

          <rect x="46" y="624" width="404" height="56" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
          <text x="248" y="649" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#0f172a">证据进入上下文 → 模型作答</text>
          <text x="248" y="669" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">每轮至多 24 次判定调用</text>
          <line x1="450" y1="700" x2="560" y2="760" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrowBlue)"/>

          <polygon points="248,742 358,790 248,838 138,790" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
          <text x="248" y="795" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0f172a">已作答 / 满 5 轮？</text>

          <rect x="46" y="880" width="404" height="56" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.4"/>
          <text x="248" y="905" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15.5" font-weight="600" fill="#0f172a">三判官重判同一批回答</text>
          <text x="248" y="925" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">gpt-4o / deepseek-v4.1-flash / gpt-5-mini</text>

          <rect x="46" y="968" width="404" height="50" rx="9" fill="#0f172a"/>
          <text x="248" y="999" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#ffffff">准确率 + 逐题配对 McNemar</text>

          <line x1="248" y1="152" x2="248" y2="182" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="240" x2="248" y2="270" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="328" x2="248" y2="358" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="416" x2="248" y2="446" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="504" x2="248" y2="534" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="592" x2="248" y2="622" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="680" x2="248" y2="740" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="838" x2="248" y2="878" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <line x1="248" y1="936" x2="248" y2="966" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
          <text x="258" y="862" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">是</text>

          <path d="M 138 790 L 30 790 L 30 212 L 44 212" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowLoop)"/>
          <text x="22" y="470" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#b45309" transform="rotate(-90 22 470)">否：下一轮（≤5）</text>

          <!-- ================= PANEL A ================= -->
          <rect x="520" y="96" width="840" height="560" rx="12" fill="#fcfdfd" stroke="#cbd5e1" stroke-width="1.4"/>
          <text x="548" y="130" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0f172a">
            为什么"先过滤、后截断"：同一批候选，两种顺序两种结果
          </text>
          <text x="548" y="156" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">
            情景：某一轮，候选池按 Jev 分数排序后的前 5 名，其中前 2 名在之前的轮次里已经交付过
          </text>

          <rect x="548" y="172" width="784" height="32" fill="#eef2f6"/>
          <text x="566" y="193" font-family="Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#334155">排名</text>
          <text x="646" y="193" font-family="Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#334155">片段</text>
          <text x="776" y="193" font-family="Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Jev 分数</text>
          <text x="896" y="193" font-family="Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#334155">是否已交付过</text>

          <line x1="548" y1="204" x2="1332" y2="204" stroke="#e2e8f0"/>
          <line x1="548" y1="240" x2="1332" y2="240" stroke="#e2e8f0"/>
          <line x1="548" y1="276" x2="1332" y2="276" stroke="#e2e8f0"/>
          <line x1="548" y1="312" x2="1332" y2="312" stroke="#e2e8f0"/>
          <line x1="548" y1="348" x2="1332" y2="348" stroke="#e2e8f0"/>

          <text x="566" y="227" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">#1</text>
          <text x="646" y="227" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">CLIP_37</text>
          <text x="776" y="227" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">0.91</text>
          <text x="896" y="227" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#b91c1c">已见 ✗</text>

          <text x="566" y="263" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">#2</text>
          <text x="646" y="263" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">CLIP_12</text>
          <text x="776" y="263" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">0.88</text>
          <text x="896" y="263" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#b91c1c">已见 ✗</text>

          <text x="566" y="299" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">#3</text>
          <text x="646" y="299" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">CLIP_05</text>
          <text x="776" y="299" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">0.84</text>
          <text x="896" y="299" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#047857">未见过 ✓</text>

          <text x="566" y="335" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">#4</text>
          <text x="646" y="335" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">CLIP_21</text>
          <text x="776" y="335" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">0.79</text>
          <text x="896" y="335" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#047857">未见过 ✓</text>

          <text x="566" y="371" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">#5</text>
          <text x="646" y="371" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">CLIP_08</text>
          <text x="776" y="371" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">0.71</text>
          <text x="896" y="371" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#047857">未见过 ✓</text>

          <text x="548" y="398" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">
            注：数值为示意，用于说明顺序差异；真实分布见 §4 的候选分数分析
          </text>

          <rect x="548" y="412" width="784" height="82" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
          <text x="566" y="438" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#065f46">filter_first（本文）</text>
          <text x="566" y="462" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#065f46">先剔除 #1 #2 → 剩下的里取前 2 = #3 CLIP_05、#4 CLIP_21</text>
          <text x="566" y="484" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#065f46">→ 本轮交付 2 段新证据 ✓</text>

          <rect x="548" y="506" width="784" height="82" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
          <text x="566" y="532" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#991b1b">topk_first（M3 原版）</text>
          <text x="566" y="556" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#991b1b">先截断取前 2 = #1 CLIP_37、#2 CLIP_12 → 两段都已交付过，被剔除</text>
          <text x="566" y="578" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#991b1b">→ 本轮空手，#3 #4 明明可用却拿不到 ✗</text>

          <text x="548" y="620" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">
            实测（web 前 500 题）：空轮率 filter_first 10.5%（79/755）对 topk_first 14.8%（109/738）
          </text>
          <text x="548" y="640" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">
            端到端：+2.20（p=0.289）与 −0.60（p=0.832），两个判官下均不显著
          </text>

          <!-- ================= PANEL B ================= -->
          <rect x="520" y="676" width="840" height="556" rx="12" fill="#fcfdfd" stroke="#cbd5e1" stroke-width="1.4"/>
          <text x="548" y="710" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0f172a">
            一轮里调用了多少次判定：24 个候选 → 至多 24 次
          </text>
          <text x="548" y="736" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">
            判定是"逐候选"的：池子有多少条候选，这一轮就发多少次请求，不是每轮固定一次
          </text>

          <rect x="548" y="756" width="118" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
          <text x="607" y="780" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0f172a">候选池</text>
          <text x="607" y="800" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">24 个</text>

          <rect x="706" y="756" width="128" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
          <text x="770" y="780" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Jev 判定</text>
          <text x="770" y="800" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">24 次调用</text>

          <rect x="874" y="756" width="128" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
          <text x="938" y="780" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0f172a">准入 s≥0.05</text>
          <text x="938" y="800" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">例：19 个通过</text>

          <rect x="1042" y="756" width="128" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
          <text x="1106" y="780" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0f172a">排序取前 2</text>
          <text x="1106" y="800" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">未见过者优先</text>

          <rect x="1210" y="756" width="122" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
          <text x="1271" y="780" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0f172a">进入上下文</text>
          <text x="1271" y="800" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#475569">2 段</text>

          <line x1="666" y1="785" x2="704" y2="785" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
          <line x1="834" y1="785" x2="872" y2="785" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
          <line x1="1002" y1="785" x2="1040" y2="785" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
          <line x1="1170" y1="785" x2="1208" y2="785" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>

          <text x="548" y="850" font-family="Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">账要怎么算才不虚高</text>
          <text x="548" y="876" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">· 一轮的调用数 = 该轮池子大小，上限由 --jev-candidate-pool 决定，默认 24</text>
          <text x="548" y="900" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">· 实际成本按"去重后的候选"算：同一（问题，候选）对只在缓存未命中时计费</text>
          <text x="548" y="924" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">· 交付的片段写入 current_clips，后续轮次不再交付——这正是上一步"已见"的来源</text>
          <text x="548" y="948" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">· 最多 5 轮，所以单题的最坏情况是 5 × 24 = 120 次调用</text>

          <rect x="548" y="970" width="784" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="566" y="996" font-family="Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">实测（{mq}+Jev@0）</text>
          <text x="566" y="1022" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">web：7,280 轮检索，平均池 23.7，候选总数 172,383，计费调用 77,526（$2.39）</text>
          <text x="566" y="1046" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">robot：4,327 轮检索，平均池 19.6，候选总数 84,658，计费调用 33,780（$1.40）</text>
          <text x="566" y="1070" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">候选总数远大于计费调用，差额来自 jev_cache 的跨配置命中</text>

          <text x="548" y="1116" font-family="Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">一句话</text>
          <text x="548" y="1142" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">这一步不改变"看多少"，只决定"先交给模型哪两段"——顺序错了，池子里有货也交不出去。</text>
          <text x="548" y="1166" font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">判定调用则是另一件事：它决定"哪些进得来"，代价可以按池子大小逐轮结清。</text>

          <text x="548" y="1206" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">
            图示示例中的片段编号与分数为示意，用于说明两种顺序的差别；实测数字取自 web / robot 全量日志
          </text>
        </svg>
    </div>

</body>
</html>
