  <text x="508" y="1146" font-family="Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569"> "clip": {"id","clip","text"}}</text>

  <text x="508" y="1188" font-family="Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">③ 写判据（type = noul）</text>
  <text x="508" y="1208" font-family="Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">true / false 两条都描述“内容”</text>
  <text x="508" y="1222" font-family="Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">不用 yes/no，避免模型顺着极性走</text>

  <text x="836" y="1058" font-family="Microsoft YaHei, sans-serif" font-size="11.5" fill="#7f1d1d">两位小数的连续分数；我们不把它解释为概率</text>

  <rect x="820" y="1090" width="636" height="138" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="836" y="1134" font-family="Microsoft YaHei, sans-serif" font-size="11.5" fill="#047857">true：The clip gives the fact the question asks for:</text>
